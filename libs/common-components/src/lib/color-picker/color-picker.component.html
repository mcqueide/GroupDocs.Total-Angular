@if (isOpen) {
  <div class="bcPicker-picker" (clickOutside)="close()" [clickOutsideEnabled]="isOpen">
    <div class="bcPicker-palette">
      @for (color of colors; track color) {
        <div class="bcPicker-color" [style.background-color]="color"
          (click)="select($event, color)" [style.border]="'1px solid ' + (color === white ? '#707070' : color)"
        (touchstart)="select($event, color)"></div>
      }
    </div>
  </div>
}
