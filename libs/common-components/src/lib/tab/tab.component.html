<div [ngClass]="(active) ? 'gd-tab active' : 'gd-tab'" (mousedown)="selectTab()">
  @if (tabTitle) {
    <div class="smp-tab-title">{{tabTitle}}</div>
  }
  @if (icon) {
    <fa-icon [icon]="['fas',icon]" [class]="'ng-fa-icon icon'"></fa-icon>
  }
</div>
@if (content) {
  <div [ngClass]="(active) ? 'tab-content active' : 'tab-content'">
    <ng-content></ng-content>
  </div>
}
